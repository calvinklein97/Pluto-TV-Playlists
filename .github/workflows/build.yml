name: Build Custom M3U

on:
  push:
    paths:
      - 'output/plutotv_de.m3u8'
      - 'PlutoLogos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # WICHTIG für commits

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Script ausführen
        run: node scripts/build_m3u.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add plutotv_de_custom.m3u8

          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Auto build M3U"
            git push origin HEAD:main
          fi

name: Build Custom M3U

on:
  push:
    paths:
      - 'output/plutotv_de.m3u8'
      - 'PlutoLogos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v3

      - name: Node installieren
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Script ausführen
        run: node scripts/build_m3u.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add plutotv_de_custom.m3u8
          git commit -m "Auto build custom M3U" || echo "No changes"
          git push
